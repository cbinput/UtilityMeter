version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: utilitymeter
      POSTGRES_USER: utilitymeter
      POSTGRES_PASSWORD: utilitymeter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - utilitymeter_network

  minio:
    image: minio/minio:RELEASE.2026-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: utilitymeter
      MINIO_ROOT_PASSWORD: utilitymeter
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - utilitymeter_network

  api:
    build:
      context: .
      target: run-api
      args:
        VERSION_PREFIX: 1.0.0.0
        VERSION_SUFFIX: docker
    ports:
      - "8080:80"
      - "8081:443"
    environment:
      DOTNET_ENVIRONMENT: docker
      ConnectionStrings__UtilityMeterDb: Host=postgres;Port=5432;Database=utilitymeter;Username=utilitymeter;******
      ObjectStorage__Provider: Minio
      ObjectStorage__Minio__Endpoint: minio:9000
      ObjectStorage__Minio__AccessKey: utilitymeter
      ObjectStorage__Minio__SecretKey: utilitymeter
      ObjectStorage__Minio__BucketName: utilitymeter-evidence
      ObjectStorage__Minio__UseSsl: "false"
    depends_on:
      - postgres
      - minio
    networks:
      - utilitymeter_network

  worker:
    build:
      context: .
      target: run-worker
      args:
        VERSION_PREFIX: 1.0.0.0
        VERSION_SUFFIX: docker
    environment:
      DOTNET_ENVIRONMENT: docker
      ConnectionStrings__UtilityMeterDb: Host=postgres;Port=5432;Database=utilitymeter;Username=utilitymeter;******
      ObjectStorage__Provider: Minio
      ObjectStorage__Minio__Endpoint: minio:9000
      ObjectStorage__Minio__AccessKey: utilitymeter
      ObjectStorage__Minio__SecretKey: utilitymeter
      ObjectStorage__Minio__BucketName: utilitymeter-evidence
      ObjectStorage__Minio__UseSsl: "false"
    depends_on:
      - postgres
      - minio
    networks:
      - utilitymeter_network

networks:
  utilitymeter_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
